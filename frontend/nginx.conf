# Serves the built SPA. History-mode fallback: unknown paths return index.html so client-side routing
# (and the Keycloak redirect back to "/") works. /api/* is NOT handled here — the ingress routes those
# prefixes to the backend services before they ever reach this pod.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # don't cache the entry HTML (so a redeploy is picked up); hashed assets can cache forever
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}