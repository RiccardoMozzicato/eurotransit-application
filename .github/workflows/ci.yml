name: CI - Build & Push images & Update GitOps configuration

# CI builds and tests each changed service, pushes an immutable image (tagged with the commit SHA) to ACR, then updates the desired image tags in the configuration repository
# CI NEVER talks to the cluster: Argo CD reconciles the Git change. No cluster credentials are ever present in this workflow!

#TODO: Osservazione (non un bug): il job build esegue ./gradlew test e poi il docker build rifà gradlew build -x test → il codice si compila due volte (una in CI, una dentro l'immagine, senza cache condivisa). È il pattern del Lab, quindi lo teniamo per coerenza, ma sappi che è un costo. Se mai volessimo ottimizzare: buildare il jar in CI e fare solo COPY nel Dockerfile.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: lab02g03registry.azurecr.io
  IMAGE_PREFIX: eurotransit

permissions:
  contents: read

jobs:
  # 1 — Detect which services changed; emit a JSON list to drive the build matrix
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    # Job-level "outputs": the ONLY way to pass data between jobs (each job runs on a fresh runner). Downstream jobs read them as "needs.detect-changes.outputs.<name>"
    # ${{ ... }} is the Actions expression syntax, evaluated before the step runs
    outputs:
      services: ${{ steps.changed.outputs.services }}
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      # Check out the repository so the runner can inspect the code and compute path changes
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Derive the short commit SHA so downstream jobs can tag images with an immutable version
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Detect which service folders changed in this commit (dorny/paths-filter is a popular GitHub Action that emits a JSON list of filter names based on which file paths changed; we will use the filter names as service names)
      - name: Filter changed paths per service
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            catalog:       'services/catalog/**'
            orders:        'services/orders/**'
            inventory:     'services/inventory/**'
            payments:      'services/payments/**'
            notifications: 'services/notifications/**'
            users:         'services/users/**'

      # Build the JSON list of services that should be processed by the build matrix
      - name: Assemble changed-service list
        id: changed
        run: |
          # On manual dispatch, rebuild everything; otherwise use the changed services.
          # `steps.filter.outputs.changes` (from dorny/paths-filter) is already a JSON array of the filter names that matched, e.g. ["orders","inventory"].
          # Writing `name=value` to $GITHUB_OUTPUT is how a step exports an output.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'services=["catalog","orders","inventory","payments","notifications"]' >> "$GITHUB_OUTPUT"
          else
            echo "services=${{ steps.filter.outputs.changes }}" >> "$GITHUB_OUTPUT"
          fi

  # 2 — Test, build and push one image per changed service (in parallel)
  build:
    name: Build & push ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      # fail-fast=false: one failing service does not cancel the sibling builds
      fail-fast: false
      # `matrix` spawns one PARALLEL copy of this job per list element; `fromJSON` turns the JSON-string output into a real list. Inside the job, `matrix.service` is the current service name
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      # Check out the code for the selected service before testing and building it
      - uses: actions/checkout@v4

      # Set up Java and enable Gradle caching to speed up the test phase
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Run the service test suite in its own module directory
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: ./gradlew test --no-daemon --console=plain

      # Prepare Buildx so Docker can build and push images with cache support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to ACR so the workflow can push the built image
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build the container image, push it, and store build cache for the next run
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ needs.detect-changes.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 3 — GitOps update: bump the image tags of the built services in the configuration repo
  update-gitops:
    name: Update GitOps values
    needs: [detect-changes, build]
    if: needs.build.result == 'success' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    steps:
      # Check out the GitOps repository that stores the desired deployment state
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          # "vars.*" = repo-level configuration variables (plain text, Settings > Variables)
          # "secrets.*" = encrypted secrets. The PAT only grants write on the CONFIG repo: this is the least-privilege bridge that lets CI change desired state without ever holding cluster credentials
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: gitops

      # Update the image tag for every service that was rebuilt in this pipeline run
      - name: Bump image tags for built services
        env:
          SHA: ${{ needs.detect-changes.outputs.short_sha }}
          SERVICES: ${{ needs.detect-changes.outputs.services }}
        run: |
          VALUES=gitops/deploy/charts/eurotransit/values.yaml
          for s in $(echo "$SERVICES" | yq -p=json -o=tsv '.[]'); do
            echo "bumping $s -> $SHA"
            yq e ".services.${s}.image.tag = \"${SHA}\"" -i "$VALUES"
          done

      # Commit and push the GitOps change so Argo CD can reconcile the new image tags
      - name: Commit and push
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/charts/eurotransit/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: bump image tags to ${{ needs.detect-changes.outputs.short_sha }}"
          git push
