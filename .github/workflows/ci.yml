name: CI - Build & Push images & Update GitOps configuration

# CI builds and tests each changed service, pushes an immutable image (tagged with the commit SHA) to ACR, then updates the desired image tags in the configuration repository
# CI NEVER talks to the cluster: Argo CD reconciles the Git change. No cluster credentials are ever present in this workflow!

#TODO: Osservazione (non un bug): il job build esegue ./gradlew test e poi il docker build rifà gradlew build -x test → il codice si compila due volte (una in CI, una dentro l'immagine, senza cache condivisa). È il pattern del Lab, quindi lo teniamo per coerenza, ma sappi che è un costo. Se mai volessimo ottimizzare: buildare il jar in CI e fare solo COPY nel Dockerfile.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # ACR del gruppo (sub "Azure for Students"). DEVE combaciare con global.registry del chart
  # (deploy/charts/eurotransit/values.yaml): la CI bumpa solo image.tag, non il repository, quindi
  # se i due registry divergono Argo pulla un'immagine inesistente -> ImagePullBackOff. Vedi agent-log #14.
  REGISTRY: labg03clusterregistry.azurecr.io
  IMAGE_PREFIX: eurotransit

permissions:
  contents: read

jobs:
  # 1 — Detect which services changed; emit a JSON list to drive the build matrix
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    # Job-level "outputs": the ONLY way to pass data between jobs (each job runs on a fresh runner). Downstream jobs read them as "needs.detect-changes.outputs.<name>"
    # ${{ ... }} is the Actions expression syntax, evaluated before the step runs
    outputs:
      services: ${{ steps.changed.outputs.services }}
      frontend_changed: ${{ steps.changed.outputs.frontend }}
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      # Check out the repository so the runner can inspect the code and compute path changes
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Derive the short commit SHA so downstream jobs can tag images with an immutable version
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Detect which service folders changed in this commit (dorny/paths-filter is a popular GitHub Action that emits a JSON list of filter names based on which file paths changed; we will use the filter names as service names)
      - name: Filter changed paths per service
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            catalog:       'services/catalog/**'
            orders:        'services/orders/**'
            inventory:     'services/inventory/**'
            payments:      'services/payments/**'
            notifications: 'services/notifications/**'
            users:         'services/users/**'
            frontend:      'frontend/**'

      # Build the JSON list of services that should be processed by the build matrix
      - name: Assemble changed-service list
        id: changed
        # Pass the paths-filter JSON through an env var: interpolating ${{ ... }} straight into a
        # double-quoted `echo "services=..."` lets the JSON's own double-quotes terminate the bash
        # string, so the value is exported UNQUOTED (invalid JSON) and fromJSON in the build matrix
        # errors out (the whole workflow then fails in ~12s before any build). Via $CHANGES the JSON
        # reaches the shell intact.
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          # On manual dispatch, rebuild every service; otherwise use the changed services.
          # `steps.filter.outputs.changes` is a JSON array of ALL matched filter names — INCLUDING `frontend`,
          # which is NOT a Gradle service and must be stripped so it never enters the build matrix. The frontend
          # is tracked separately via `steps.filter.outputs.frontend` and built by its own job (build-frontend).
          # Writing `name=value` to $GITHUB_OUTPUT is how a step exports an output.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'services=["catalog","orders","inventory","payments","notifications"]' >> "$GITHUB_OUTPUT"
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          else
            echo "services=$(echo "$CHANGES" | jq -c 'map(select(. != "frontend"))')" >> "$GITHUB_OUTPUT"
            echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          fi

  # 2 — Test, build and push one image per changed service (in parallel)
  build:
    name: Build & push ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      # fail-fast=false: one failing service does not cancel the sibling builds
      fail-fast: false
      # `matrix` spawns one PARALLEL copy of this job per list element; `fromJSON` turns the JSON-string output into a real list. Inside the job, `matrix.service` is the current service name
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      # Check out the code for the selected service before testing and building it
      - uses: actions/checkout@v4

      # Set up Java and enable Gradle caching to speed up the test phase
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Run the service test suite in its own module directory
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: ./gradlew test --no-daemon --console=plain

      # Prepare Buildx so Docker can build and push images with cache support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to ACR so the workflow can push the built image
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build the container image, push it, and store build cache for the next run
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ needs.detect-changes.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 2b — Build & push the frontend image (the SPA is not a Gradle service, so it gets its own job, not the matrix).
  # Mirrors the service build-push, but with a Node type-check/build gate and the prod VITE_KEYCLOAK_URL baked in.
  build-frontend:
    name: Build & push frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Type-check + production bundle gate (npm run build = tsc --noEmit && vite build) — the frontend's CI test equivalent
      - name: Type-check & build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # VITE_* are baked at image-build time; prod points the SPA at the real Keycloak host.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_KEYCLOAK_URL=https://auth.g03.cpo2026.it
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ needs.detect-changes.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # 3 — GitOps update: bump the image tags of the built services (and the frontend) in the configuration repo
  update-gitops:
    name: Update GitOps values
    needs: [detect-changes, build, build-frontend]
    # Run when at least one image was (re)built and neither build failed. `always()` is required because a
    # frontend-only change SKIPS the service `build` matrix (and a service-only change skips build-frontend) —
    # without it, update-gitops would be skipped whenever any of its needs was skipped.
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.build.result != 'failure' && needs.build.result != 'cancelled' &&
      needs.build-frontend.result != 'failure' && needs.build-frontend.result != 'cancelled' &&
      (needs.detect-changes.outputs.services != '[]' || needs.detect-changes.outputs.frontend_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      # Check out the GitOps repository that stores the desired deployment state
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          # "vars.*" = repo-level configuration variables (plain text, Settings > Variables)
          # "secrets.*" = encrypted secrets. The PAT only grants write on the CONFIG repo: this is the least-privilege bridge that lets CI change desired state without ever holding cluster credentials
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: gitops

      # Update the image tag for every service (and the frontend) rebuilt in this pipeline run
      - name: Bump image tags for built images
        env:
          SHA: ${{ needs.detect-changes.outputs.short_sha }}
          SERVICES: ${{ needs.detect-changes.outputs.services }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend_changed }}
        run: |
          VALUES=gitops/deploy/charts/eurotransit/values.yaml
          if [ -n "$SERVICES" ] && [ "$SERVICES" != "[]" ]; then
            for s in $(echo "$SERVICES" | yq -p=json -o=tsv '.[]'); do
              echo "bumping services.$s -> $SHA"
              yq e ".services.${s}.image.tag = \"${SHA}\"" -i "$VALUES"
            done
          fi
          # The frontend tag is a TOP-LEVEL key (frontend.image.tag), not under services.*
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            echo "bumping frontend -> $SHA"
            yq e ".frontend.image.tag = \"${SHA}\"" -i "$VALUES"
          fi

      # Commit and push the GitOps change so Argo CD can reconcile the new image tags
      - name: Commit and push
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/charts/eurotransit/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: bump image tags to ${{ needs.detect-changes.outputs.short_sha }}"
          git push
