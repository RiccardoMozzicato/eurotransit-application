spring:
  datasource:
    # values come from environment variables injected by the deployment
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentsdb}
    username: ${DB_USER:payments}
    password: ${DB_PASS:payments}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Flyway owns schema changes in the PostgreSQL profile; Hibernate only checks consistency
    enabled: true    # Flyway owns the schema in-cluster; Hibernate only validates (ddl-auto)
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      # don't let Hibernate mutate the production schema; only validate mappings
      ddl-auto: validate
    properties:
      hibernate:
        # match PostgreSQL behavior more closely in SQL generation
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Structured JSON logging (Pillar D, §7.5): in-cluster the console emits ECS JSON so the platform's log
# pipeline parses fields, and micrometer-tracing's traceId/spanId (already in MDC) surface as
# trace.id/span.id — the log<->trace correlation that answers "why" on the money path. Local dev (base
# profile, no postgres) keeps the human-readable console.
logging:
  structured:
    format:
      console: ecs
