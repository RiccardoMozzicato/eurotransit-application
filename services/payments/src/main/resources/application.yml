spring:
  application:
    name: payments
  datasource:
    # PostgreSQL everywhere (no H2). Values are env-driven with local-dev defaults; the cluster supplies
    # them via the config repo (ConfigMap/SealedSecret). Payments has a DEDICATED money-path datasource; dev
    # uses one shared `eurotransit` database with a schema per service — this service owns `payments`.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eurotransit}
    username: ${DB_USER:payments}
    password: ${DB_PASS:payments}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Flyway owns the schema; it creates and migrates into the per-service `payments` schema
    enabled: true
    schemas: payments
    default-schema: payments
  jpa:
    hibernate:
      # Hibernate only validates the Flyway-owned schema; it never mutates it
      ddl-auto: validate
    # Don't hold the persistence context + DB connection open for the whole request (undermines the
    # connection-pool bulkhead on the money path).
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payments
        format_sql: true
  kafka:
    # ${VAR:default} = env var if set (in-cluster), localhost fallback for local dev
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # acks=all + idempotent producer: durable, duplicate-free publishing of the saga replies the outbox relay emits (see inventory/orders application.yml for details)
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payments
      auto-offset-reset: earliest
      # Manual ack -> at-least-once delivery -> handlers must be idempotent (idempotency table is this service's core design constraint)
      enable-auto-commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate Keycloak JWTs. jwk-set-uri (NOT issuer-uri) builds the decoder lazily — JWKS is
          # fetched + cached on the first token — so startup is not coupled to Keycloak (Pillar C).
          # The `iss` claim is checked separately against app.oidc.issuer by SecurityConfig.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/eurotransit/protocol/openid-connect/certs}

server:
  # Default local HTTP port
  port: 8080

# App-level tunables (overridable by env), see root CLAUDE.md "Configuration & variable injection".
app:
  oidc:
    # Expected `iss` claim on incoming tokens; SecurityConfig rejects tokens from any other issuer.
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/eurotransit}
  outbox:
    # Transactional-outbox relay: replies (payment-result / payment-captured) commit with the business change,
    # then this background relay publishes the unpublished rows to Kafka. Disabled in tests (no broker).
    enabled: ${OUTBOX_ENABLED:true}
    # How often the relay drains the outbox (ISO-8601 duration); short for a snappy money path.
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT0.5S}

# (mock) PSP decision rule: amounts at/above this threshold are DECLINED. Lets the demo exercise the saga
# compensation path on demand (order a huge qty -> decline).
payments:
  decline-threshold-cents: ${PAYMENTS_DECLINE_THRESHOLD_CENTS:100000}

# Observability (Pillar D): K8s probes, Prometheus scrape endpoint, OTel tracing
# OTLP endpoint is a local default; in-cluster it is overridden via env (MANAGEMENT_OTLP_TRACING_ENDPOINT) to point at the collector / Tempo
management:
  endpoints:
    web:
      exposure:
        # expose only endpoints that service and platform actually need
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # enable Kubernetes readiness/liveness style probes
        enabled: true
      # show details to simplify local debug; cluster policy can override this
      show-details: always
      group:
        readiness:
          # Readiness should reflect both application state and database availability
          include: readinessState,db
  health:
    readinessstate:
      # Spring Boot's readiness lifecycle state
      enabled: true
    livenessstate:
      # Spring Boot's liveness lifecycle state
      enabled: true
  tracing:
    sampling:
      # sample every trace locally to inspect complete request flows
      probability: 1.0
  otlp:
    tracing:
      # local default collector endpoint; overridden in cluster deployment
      endpoint: http://localhost:4318/v1/traces

# Kafka's client classes log their ENTIRE resolved config as a multi-hundred-line table at INFO on every
# client init (ProducerConfig/ConsumerConfig/AdminClientConfig) — pure startup noise that buries real logs.
# Silence just those loggers; genuine Kafka INFO (group rebalances, partition assignment) is kept.
logging:
  level:
    org.apache.kafka.clients.producer.ProducerConfig: warn
    org.apache.kafka.clients.consumer.ConsumerConfig: warn
    org.apache.kafka.clients.admin.AdminClientConfig: warn
