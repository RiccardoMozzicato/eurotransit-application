spring:
  application:
    name: payments
  datasource:
    url: jdbc:h2:mem:paymentsdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false   # local H2 dev: schema via ddl-auto; Flyway runs only on the postgres profile
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    # ${VAR:default} = env var if set (in-cluster), localhost fallback for local dev.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # acks=all + idempotent producer: durable, duplicate-free publishing of
      # payment-authorized events (see inventory/orders application.yml for details).
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payments
      auto-offset-reset: earliest
      # Manual ack → at-least-once delivery → handlers must be idempotent (they are:
      # the idempotency table is this service's core design constraint).
      enable-auto-commit: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
