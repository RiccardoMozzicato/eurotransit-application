spring:
  application:
    name: payments
  datasource:
    # PostgreSQL everywhere (no H2). Values are env-driven with local-dev defaults; the cluster supplies
    # them via the config repo (ConfigMap/SealedSecret). Payments has a DEDICATED money-path datasource; dev
    # uses one shared `eurotransit` database with a schema per service — this service owns `payments`.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eurotransit}
    username: ${DB_USER:payments}
    password: ${DB_PASS:payments}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Flyway owns the schema; it creates and migrates into the per-service `payments` schema
    enabled: true
    schemas: payments
    default-schema: payments
  jpa:
    hibernate:
      # Hibernate only validates the Flyway-owned schema; it never mutates it
      ddl-auto: validate
    # Don't hold the persistence context + DB connection open for the whole request (undermines the
    # connection-pool bulkhead on the money path).
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payments
        format_sql: true
  kafka:
    # ${VAR:default} = env var if set (in-cluster), localhost fallback for local dev
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # acks=all + idempotent producer: durable, duplicate-free publishing of the saga replies the outbox relay emits (see inventory/orders application.yml for details)
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payments
      auto-offset-reset: earliest
      # Manual ack -> at-least-once delivery -> handlers must be idempotent (idempotency table is this service's core design constraint)
      enable-auto-commit: false
    # Fase 4 cross-Kafka tracing: continue the W3C trace carried by the Debezium-produced `traceparent`
    # header (listener); template observation covers the few direct sends (the DLT recoverer).
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate Keycloak JWTs. jwk-set-uri (NOT issuer-uri) builds the decoder lazily — JWKS is
          # fetched + cached on the first token — so startup is not coupled to Keycloak (Pillar C).
          # The `iss` claim is checked separately against app.oidc.issuer by SecurityConfig.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/eurotransit/protocol/openid-connect/certs}

server:
  # Default local HTTP port
  port: 8080

# App-level tunables (overridable by env), see root CLAUDE.md "Configuration & variable injection".
app:
  oidc:
    # Expected `iss` claim on incoming tokens; SecurityConfig rejects tokens from any other issuer.
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/eurotransit}

# PSP provider selection: `mock` (default — deterministic threshold rule for dev/tests) or `paypal` (real
# PayPal sandbox, opt-in via env in-cluster). The mock threshold is only consulted when provider=mock.
payments:
  provider: ${PAYMENTS_PROVIDER:mock}
  # (mock) PSP decision rule: amounts at/above this threshold are DECLINED. Lets the demo exercise the saga
  # compensation path on demand (order a huge qty -> decline).
  decline-threshold-cents: ${PAYMENTS_DECLINE_THRESHOLD_CENTS:100000}

# PayPal Orders v2 (sandbox) — server-to-server card flow. Credentials + test card come from the config repo as
# a SealedSecret (never hardcoded); base-url defaults to the sandbox host. Only consulted when provider=paypal.
paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  test-card:
    number: ${PAYPAL_TEST_CARD_NUMBER:}
    expiry: ${PAYPAL_TEST_CARD_EXPIRY:}
    security-code: ${PAYPAL_TEST_CARD_CVV:}

# Resilience (Pillar C) around the outbound PayPal call. Retry only retryable transport failures
# (TransientPspException = 5xx/timeout/network); a DECLINE is a returned business outcome, never retried. When
# the breaker is open the call fails fast — the throw rolls back the transaction so the Kafka retry/DLT + the
# orders timeout sweeper re-drive the saga.
resilience4j:
  retry:
    instances:
      paypal:
        max-attempts: 3
        wait-duration: PT0.5S
        retry-exceptions:
          - it.g03.payments.gateway.TransientPspException
  circuitbreaker:
    instances:
      paypal:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: PT10S
        record-exceptions:
          - it.g03.payments.gateway.TransientPspException
        ignore-exceptions:
          - it.g03.payments.gateway.PspException

# Observability (Pillar D): K8s probes, Prometheus scrape endpoint, OTel tracing
# OTLP endpoint is a local default; in-cluster it is overridden via env (MANAGEMENT_OTLP_TRACING_ENDPOINT) to point at the collector / Tempo
management:
  # Fase 4: emit http.server.requests histogram buckets so p99 (RED/SLO), exemplar->trace, and the
  # canary p99 analysis gate work. Bracketed key = Spring relaxed-binding for a map key holding dots.
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      maximum-expected-value:
        "[http.server.requests]": 2s
  endpoints:
    web:
      exposure:
        # expose only endpoints that service and platform actually need
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # enable Kubernetes readiness/liveness style probes
        enabled: true
      # show details to simplify local debug; cluster policy can override this
      show-details: always
      group:
        readiness:
          # Readiness should reflect both application state and database availability
          include: readinessState,db,warmup
  health:
    readinessstate:
      # Spring Boot's readiness lifecycle state
      enabled: true
    livenessstate:
      # Spring Boot's liveness lifecycle state
      enabled: true
  tracing:
    sampling:
      # sample every trace locally to inspect complete request flows
      probability: 1.0
  # Boot 4 property home for the OTLP trace export (the Boot-3 `management.otlp.tracing.endpoint` binds
  # NOTHING on Boot 4 -> no exporter, spans silently never sent; found live on AKS, config agent-log #23).
  # localhost = the local-dev default; in-cluster the chart overrides it via
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT (-> the otel-collector gateway).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

# Kafka's client classes log their ENTIRE resolved config as a multi-hundred-line table at INFO on every
# client init (ProducerConfig/ConsumerConfig/AdminClientConfig) — pure startup noise that buries real logs.
# Silence just those loggers; genuine Kafka INFO (group rebalances, partition assignment) is kept.
logging:
  level:
    org.apache.kafka.clients.producer.ProducerConfig: warn
    org.apache.kafka.clients.consumer.ConsumerConfig: warn
    org.apache.kafka.clients.admin.AdminClientConfig: warn
