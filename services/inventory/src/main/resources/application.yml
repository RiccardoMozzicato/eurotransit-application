spring:
  application:
    # logical service name used in logs, metrics and discovery-related metadata
    name: inventory
  data:
    web:
      pageable:
        # sane default + hard cap on page size for any paginated list endpoint
        default-page-size: 20
        max-page-size: 100
  datasource:
    # PostgreSQL everywhere (no H2). Values are env-driven with local-dev defaults; the cluster supplies
    # them via the config repo (ConfigMap/SealedSecret). Inventory has a DEDICATED money-path datasource;
    # dev uses one shared `eurotransit` database with a schema per service — this service owns `inventory`.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eurotransit}
    username: ${DB_USER:inventory}
    password: ${DB_PASS:inventory}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Flyway owns the schema; it creates and migrates into the per-service `inventory` schema
    enabled: true
    schemas: inventory
    default-schema: inventory
  jpa:
    hibernate:
      # Hibernate only validates the Flyway-owned schema; it never mutates it
      ddl-auto: validate
    # Don't hold the persistence context + DB connection open for the whole request (undermines the
    # connection-pool bulkhead the contended path relies on under load).
    open-in-view: false
    # print SQL to make persistence behavior easier to inspect locally (off in the cluster overlay)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # this service's tables live in the `inventory` schema
        default_schema: inventory
        # format SQL so the output is easier to read in logs
        format_sql: true
  kafka:
    # ${VAR:default} = Spring property placeholder: use env var KAFKA_BOOTSTRAP if set (injected in-cluster by the Helm chart), else fall back to localhost for local dev
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # Durable publishing: acks=all waits for the in-sync replicas (pairs with the broker's min.insync.replicas=2); idempotent producer = broker drops the duplicates created by producer-side retries
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: inventory
      auto-offset-reset: earliest
      # Manual offset commit: we acknowledge only AFTER the handler durably processed the event, so a crash mid-processing causes a redelivery (at-least-once) instead of a silent loss, which is safe because our handlers are idempotent
      enable-auto-commit: false
    # Fase 4 cross-Kafka tracing: continue the W3C trace carried by the Debezium-produced `traceparent`
    # header (listener); template observation covers the few direct sends (the DLT recoverer).
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate Keycloak JWTs. jwk-set-uri (NOT issuer-uri) builds the decoder lazily — JWKS is
          # fetched + cached on the first token — so startup is not coupled to Keycloak (Pillar C).
          # The `iss` claim is checked separately against app.oidc.issuer by SecurityConfig.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/eurotransit/protocol/openid-connect/certs}

server:
  # Default local HTTP port
  port: 8080

# App-level tunables (overridable by env), see root CLAUDE.md "Configuration & variable injection".
app:
  oidc:
    # Expected `iss` claim on incoming tokens; SecurityConfig rejects tokens from any other issuer.
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/eurotransit}

# Reservation hold semantics: a RESERVED hold not confirmed/released within "ttl" is swept back to stock by the reconciler (every "sweep-interval"). ISO-8601 durations
inventory:
  reservation:
    # how long a hold stays valid before it can be swept back to stock (the hold TTL)
    ttl: PT2M
    # how often the reconciler wakes up to sweep overdue holds
    sweep-interval: PT15S
    # background sweep on/off (Fase 2 #5.5): default true in prod; tests set false so the loop never races assertions
    enabled: true

# Observability (Pillar D): K8s probes, Prometheus scrape endpoint, OTel tracing
# OTLP endpoint is a local default; in-cluster it is overridden via env (MANAGEMENT_OTLP_TRACING_ENDPOINT) to point at the collector / Tempo
management:
  # Fase 4: emit http.server.requests histogram buckets so p99 (RED/SLO), exemplar->trace, and the
  # canary p99 analysis gate work. Bracketed key = Spring relaxed-binding for a map key holding dots.
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      maximum-expected-value:
        "[http.server.requests]": 2s
  endpoints:
    web:
      exposure:
        # expose only endpoints that service and platform actually need
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # enable Kubernetes readiness/liveness style probes
        enabled: true
      # show details to simplify local debug; cluster policy can override this
      show-details: always
      group:
        readiness:
          # Readiness should reflect both application state and database availability
          include: readinessState,db
  health:
    readinessstate:
      # Spring Boot's readiness lifecycle state
      enabled: true
    livenessstate:
      # Spring Boot's liveness lifecycle state
      enabled: true
  tracing:
    sampling:
      # sample every trace locally to inspect complete request flows
      probability: 1.0
  # Boot 4 property home for the OTLP trace export (the Boot-3 `management.otlp.tracing.endpoint` binds
  # NOTHING on Boot 4 -> no exporter, spans silently never sent; found live on AKS, config agent-log #23).
  # localhost = the local-dev default; in-cluster the chart overrides it via
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT (-> the otel-collector gateway).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

# Kafka's client classes log their ENTIRE resolved config as a multi-hundred-line table at INFO on every
# client init (ProducerConfig/ConsumerConfig/AdminClientConfig) — pure startup noise that buries real logs.
# Silence just those loggers; genuine Kafka INFO (group rebalances, partition assignment) is kept.
logging:
  level:
    org.apache.kafka.clients.producer.ProducerConfig: warn
    org.apache.kafka.clients.consumer.ConsumerConfig: warn
    org.apache.kafka.clients.admin.AdminClientConfig: warn
