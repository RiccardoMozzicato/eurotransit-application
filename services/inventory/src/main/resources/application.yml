spring:
  application:
    name: inventory
  datasource:
    url: jdbc:h2:mem:inventorydb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false   # local H2 dev: schema via ddl-auto; Flyway runs only on the postgres profile
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    # ${VAR:default} = Spring property placeholder: use env var KAFKA_BOOTSTRAP if set
    # (injected in-cluster by the Helm chart), else fall back to localhost for local dev.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # Durable publishing: acks=all waits for the in-sync replicas (pairs with the
      # broker's min.insync.replicas=2); idempotent producer = broker drops the
      # duplicates created by producer-side retries.
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: inventory
      auto-offset-reset: earliest
      # Manual offset commit: we acknowledge only AFTER the handler durably processed
      # the event, so a crash mid-processing causes a redelivery (at-least-once) instead
      # of a silent loss — which is safe because our handlers are idempotent.
      enable-auto-commit: false

server:
  port: 8080

# Reservation hold semantics: a RESERVED hold not confirmed/released within `ttl` is
# swept back to stock by the reconciler (every `sweep-interval`). ISO-8601 durations.
inventory:
  reservation:
    ttl: PT2M
    sweep-interval: PT15S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
