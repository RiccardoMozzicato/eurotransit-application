spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventorydb}
    username: ${DB_USER:inventory}
    password: ${DB_PASS:inventory}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true    # Flyway owns the schema in-cluster; Hibernate only validates (ddl-auto)
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
