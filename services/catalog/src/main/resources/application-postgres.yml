# Cluster overlay — activate with SPRING_PROFILES_ACTIVE=postgres.
# The datasource, Flyway and schema config now live in the base application.yml (Postgres everywhere);
# this profile only tightens things that should differ in a real cluster vs local dev.
spring:
  jpa:
    # don't log every statement in the cluster
    show-sql: false

management:
  endpoint:
    health:
      # don't leak internal health details over the cluster probe endpoint
      show-details: never

# Structured JSON logging (Pillar D, §7.5): in-cluster the console emits ECS JSON so the platform's log
# pipeline parses fields, and micrometer-tracing's traceId/spanId (already in MDC) surface as
# trace.id/span.id — the log<->trace correlation that answers "why". Local dev (base profile, no
# postgres) keeps the human-readable console.
logging:
  structured:
    format:
      console: ecs
