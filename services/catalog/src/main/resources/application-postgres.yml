spring:
  datasource:
    # values come from environment variables injected by the deployment
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogdb}
    username: ${DB_USER:catalog}
    password: ${DB_PASS:catalog}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Flyway owns schema changes in the PostgreSQL profile; Hibernate only checks consistency
    enabled: true
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      # don't let Hibernate mutate the production schema; only validate mappings
      ddl-auto: validate
    properties:
      hibernate:
        # match PostgreSQL behavior more closely in SQL generation
        dialect: org.hibernate.dialect.PostgreSQLDialect
