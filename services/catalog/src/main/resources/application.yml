spring:
  application:
    # logical service name used in logs, metrics and discovery-related metadata
    name: catalog
  data:
    web:
      pageable:
        # sane default + hard cap on page size for every paginated list endpoint
        default-page-size: 20
        max-page-size: 100
  datasource:
    # PostgreSQL everywhere (no H2). Values are env-driven with local-dev defaults; the cluster
    # supplies them via the config repo (ConfigMap/SealedSecret). Dev uses one shared `eurotransit`
    # database with a schema per service — this service owns the `catalog` schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eurotransit}
    username: ${DB_USER:catalog}
    password: ${DB_PASS:catalog}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Flyway owns the schema; it creates and migrates into the per-service `catalog` schema
    enabled: true
    schemas: catalog
    default-schema: catalog
  jpa:
    hibernate:
      # Hibernate only validates the Flyway-owned schema; it never mutates it
      ddl-auto: validate
    # Don't hold the persistence context + DB connection open for the whole request (it buys nothing for
    # these flat, eagerly-mapped reads and only ties up a pooled connection longer — undermines bulkheading).
    open-in-view: false
    # print SQL to make persistence behavior easier to inspect locally (off in the cluster overlay)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # this service's tables live in the `catalog` schema
        default_schema: catalog
        # format SQL so the output is easier to read in logs
        format_sql: true
  kafka:
    # ${VAR:default} = Spring property placeholder: use env var KAFKA_BOOTSTRAP if set (injected in-cluster by
    # the Helm chart), else fall back to localhost for local dev. Catalog is CONSUME-ONLY (availability
    # read-model); the only producer use is the dead-letter recoverer.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      # dedicated group for the availability projection; earliest so a fresh consumer replays history and the
      # read-model converges (the projection is idempotent + out-of-order-safe, so replay is harmless)
      group-id: catalog-availability
      auto-offset-reset: earliest
      # Manual offset commit: acknowledge only AFTER a clean handler return, so a crash mid-processing causes a
      # redelivery (at-least-once) instead of a silent loss — safe because the projection is idempotent.
      enable-auto-commit: false
    # Fase 4 cross-Kafka tracing: continue the W3C trace carried by the Debezium-produced `traceparent` header
    # (listener); template observation covers the DLT recoverer's sends.
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate Keycloak JWTs. jwk-set-uri (NOT issuer-uri) builds the decoder lazily — JWKS is
          # fetched + cached on the first token — so startup is not coupled to Keycloak (Pillar C).
          # The `iss` claim is checked separately against app.oidc.issuer by SecurityConfig.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/eurotransit/protocol/openid-connect/certs}

server:
  # Default local HTTP port
  port: 8080

# App-level tunables (overridable by env), see root CLAUDE.md "Configuration & variable injection".
app:
  oidc:
    # Expected `iss` claim on incoming tokens; SecurityConfig rejects tokens from any other issuer.
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/eurotransit}
  # Price-quote signing (see PricingConfig / PriceQuoteSigner). The EC PRIVATE key (JWK JSON) is injected via
  # PRICE_QUOTE_SIGNING_KEY (a SealedSecret in-cluster); blank falls back to the baked DEV-ONLY key. quote-ttl
  # bounds how long a browsed price stays honourable at checkout.
  pricing:
    signing-key: ${PRICE_QUOTE_SIGNING_KEY:}
    quote-ttl: PT30M

# Observability (Pillar D): K8s probes, Prometheus scrape endpoint, OTel tracing
# OTLP endpoint is a local default; in-cluster it is overridden via env (MANAGEMENT_OTLP_TRACING_ENDPOINT) to point at the collector / Tempo
management:
  # Fase 4: emit http.server.requests histogram buckets so p99 (RED/SLO), exemplar->trace, and the
  # canary p99 analysis gate work. Bracketed key = Spring relaxed-binding for a map key holding dots.
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      maximum-expected-value:
        "[http.server.requests]": 2s
  endpoints:
    web:
      exposure:
        # expose only endpoints that service and platform actually need
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # enable Kubernetes readiness/liveness style probes
        enabled: true
      # show details to simplify local debug; cluster policy can override this
      show-details: always
      group:
        readiness:
          # Readiness should reflect both application state and database availability
          include: readinessState,db,warmup
  health:
    readinessstate:
      # Spring Boot's readiness lifecycle state
      enabled: true
    livenessstate:
      # Spring Boot's liveness lifecycle state
      enabled: true
  tracing:
    sampling:
      # sample every trace locally to inspect complete request flows
      probability: 1.0
  # Boot 4 property home for the OTLP trace export (the Boot-3 `management.otlp.tracing.endpoint` binds
  # NOTHING on Boot 4 -> no exporter, spans silently never sent; found live on AKS, config agent-log #23).
  # localhost = the local-dev default; in-cluster the chart overrides it via
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT (-> the otel-collector gateway).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

# Kafka's client classes log their ENTIRE resolved config as a multi-hundred-line table at INFO on every
# client init (ConsumerConfig/ProducerConfig/AdminClientConfig) — pure startup noise. Silence just those
# loggers; genuine Kafka INFO (group rebalances, partition assignment) is kept.
logging:
  level:
    org.apache.kafka.clients.consumer.ConsumerConfig: warn
    org.apache.kafka.clients.producer.ProducerConfig: warn
    org.apache.kafka.clients.admin.AdminClientConfig: warn
