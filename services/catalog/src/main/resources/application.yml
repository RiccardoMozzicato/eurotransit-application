spring:
  application:
    name: catalog
  datasource:
    url: jdbc:h2:mem:catalogdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false   # local H2 dev: schema via ddl-auto; Flyway runs only on the postgres profile
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# Observability (Pillar D): K8s probes, Prometheus scrape endpoint, OTel tracing.
# The OTLP endpoint is a local default; in-cluster it is overridden via env
# (MANAGEMENT_OTLP_TRACING_ENDPOINT) to point at the collector / Tempo.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
