spring:
  application:
    name: orders
  datasource:
    url: jdbc:h2:mem:ordersdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false   # local H2 dev: schema via ddl-auto; Flyway runs only on the postgres profile
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # Durable publishing for the outbox relay: full ISR ack + idempotent producer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: orders
      auto-offset-reset: earliest
      # Manual ack: we commit the offset only after the handler has durably processed
      # the event, so an at-least-once redelivery is safe (consumers are idempotent).
      enable-auto-commit: false

server:
  port: 8080

app:
  # Flat demo pricing: looking prices up in Catalog would add a sync dependency to the
  # money path that the track's interaction shape does not call for.
  unit-price-cents: 1000
  # Sibling-service base URLs: env vars in-cluster (Kubernetes Service DNS, injected by
  # the Helm chart), localhost ports for local multi-process dev.
  inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
  payments-base-url: ${PAYMENTS_BASE_URL:http://localhost:8082}
  # Transactional-outbox relay (see OutboxPublisher): tests set enabled=false.
  outbox:
    enabled: true
    poll-interval: PT0.5S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      # Readiness depends on our OWN database. Kafka outages are absorbed by the async
      # pipeline (retry/redelivery), so we deliberately keep Kafka OUT of readiness to
      # avoid flapping the critical sync entry API on transient broker issues.
      group:
        readiness:
          include: readinessState,db
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
