spring:
  application:
    name: orders
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  datasource:
    # PostgreSQL everywhere (no H2). Values are env-driven with local-dev defaults; the cluster supplies
    # them via the config repo (ConfigMap/SealedSecret). Orders has a DEDICATED money-path datasource; dev
    # uses one shared `eurotransit` database with a schema per service — this service owns `orders`.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eurotransit}
    username: ${DB_USER:orders}
    password: ${DB_PASS:orders}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Flyway owns the schema; it creates and migrates into the per-service `orders` schema
    enabled: true
    schemas: orders
    default-schema: orders
  jpa:
    hibernate:
      # Hibernate only validates the Flyway-owned schema; it never mutates it
      ddl-auto: validate
    # Don't hold the persistence context + DB connection open for the whole request (it ties up a pooled
    # connection across the saga's remote calls and undermines bulkheading on the money path).
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: orders
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # Durable publishing for the outbox relay: full ISR ack + idempotent producer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: orders
      auto-offset-reset: earliest
      # Manual ack: we commit the offset only after the handler has durably processed the event, so an at-least-once redelivery is safe (consumers are idempotent)
      enable-auto-commit: false
    # Fase 4 cross-Kafka tracing: the listener observation extracts the W3C `traceparent` header that
    # Debezium copies from the outbox row, so the consumer span CONTINUES the producer's trace instead of
    # starting a fresh one; template observation covers the few direct sends (the DLT recoverer).
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # INBOUND: validate Keycloak user tokens on /api/orders. jwk-set-uri (NOT issuer-uri) builds the
          # decoder lazily, so startup is not coupled to Keycloak (Pillar C); SecurityConfig checks `iss`.
          # No oauth2 CLIENT block: the money path is async Kafka now, so there are no authenticated outbound calls.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/eurotransit/protocol/openid-connect/certs}

server:
  port: 8080

app:
  # Price-quote verification (see PricingConfig / PriceQuoteVerifier). The EC PUBLIC key (JWK JSON) matching
  # Catalog's signing key is injected via PRICE_QUOTE_PUBLIC_KEY (a non-secret ConfigMap value); blank falls
  # back to the baked DEV-ONLY public key. Orders verifies the browse-time quote locally — Catalog stays off
  # the money path.
  pricing:
    verify-key: ${PRICE_QUOTE_PUBLIC_KEY:}
  # Human-gated checkout: the backend-owned hold window. Stamped on the first leg add; re-checked server-side at
  # pay and enforced by CheckoutExpirySweeper (never trust a client countdown). MUST be <= inventory.reservation.ttl
  # so a reserve-on-add hold is not reclaimed by the inventory reconciler before the user can pay.
  checkout:
    window: PT15M
    # Give-up-at-the-window sweeper: rejects HELD/PAYING bookings whose window elapsed (EXPIRED_NO_PAYMENT vs
    # SERVICE_UNAVAILABLE by paymentInitiatedAt). Tests set enabled=false and drive the sweep/state machine directly.
    expiry-sweeper:
      enabled: true
      poll-interval: PT5S
  # Expected `iss` claim on inbound tokens; SecurityConfig rejects tokens from any other issuer.
  oidc:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/eurotransit}
  # Timeout sweeper (OrderTimeoutSweeper): re-drives orders stuck in a non-terminal state past the deadline by
  # re-emitting the command for their current state (idempotent commands make a re-send safe). This is the
  # liveness backstop of the async saga; tests set enabled=false to avoid racing their assertions.
  timeout-sweeper:
    enabled: true
    poll-interval: PT5S
    # Backstop for genuinely-LOST replies only. Must exceed worst-case step latency (incl. a consumer pod
    # restart + group rebalance + Spring Boot startup, ~60-90s on a small cluster); too tight and the sweeper
    # re-drives merely-slow steps, amplifying an outage into duplicate (idempotent) commands.
    deadline: PT2M
  # Housekeeping sweep (AbandonedDraftSweeper): hard-deletes DRAFT bookings idle past max-age — abandoned empty
  # carts that never became a booking (no seats held, no money, outside the Debezium publication, so removing them
  # emits nothing). Reclaims storage, not correctness. poll-interval is kept far below max-age on purpose:
  # @Scheduled fixedDelay resets its clock at startup, so a multi-day interval could otherwise never fire on a
  # cluster that redeploys often. Tests set enabled=false and drive the sweep directly.
  draft-sweeper:
    enabled: true
    poll-interval: PT6H
    max-age: P3D

management:
  # Fase 4: emit http.server.requests histogram buckets so p99 (RED/SLO), exemplar->trace, and the
  # canary p99 analysis gate work. Bracketed key = Spring relaxed-binding for a map key holding dots.
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      maximum-expected-value:
        "[http.server.requests]": 2s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      # Readiness depends on our OWN database. Kafka outages are absorbed by the async pipeline (retry/redelivery), so we deliberately keep Kafka OUT of readiness to avoid flapping the critical sync entry API on transient broker issues
      group:
        readiness:
          include: readinessState,db,warmup
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    # The intake rate limiter must NEVER influence health/readiness (Fase 2 #3): shedding excess load is the system WORKING (controlled refusal), not failing. A saturated limiter must NOT flip readiness
    ratelimiters:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  # Boot 4 property home for the OTLP trace export (the Boot-3 `management.otlp.tracing.endpoint` binds
  # NOTHING on Boot 4 -> no exporter, spans silently never sent; found live on AKS, config agent-log #23).
  # localhost = the local-dev default; in-cluster the chart overrides it via
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT (-> the otel-collector gateway).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

# The Orders -> Payments circuit breaker, the retry, and the bulkhead are RETIRED: the money path is now async
# Kafka command/reply, so its resilience comes from temporal decoupling (Kafka buffering + bounded consumer
# retry + DLT via KafkaErrorHandler + the timeout sweeper), not a synchronous breaker. Only the edge rate
# limiter survives (it governs the sync POST /api/orders intake, which is unchanged). See the config repo README / docs/design.md.
resilience4j:
  # Backpressure / load shedding at the synchronous intake (@RateLimiter on OrdersController.place). Once the
  # per-window budget is exhausted the public POST /api/orders is refused immediately with HTTP 429 + Retry-After
  # instead of being queued until the system collapses. The 429 is EDGE-only: internal saga calls are governed by
  # breaker/bulkhead, never a 429 (#3.5). The threshold is a TEAM policy decision, tunable from a load-test baseline.
  ratelimiter:
    instances:
      orders-intake:
        limit-for-period: 20      # max accepted POST /api/orders per refresh window (demo value, tunable)
        limit-refresh-period: PT1S    # the window -> ~20 accepted req/s sustained
        timeout-duration: PT0S    # controlled refusal: NEVER block/queue waiting for a permit -> shed immediately

# Kafka's client classes log their ENTIRE resolved config as a multi-hundred-line table at INFO on every
# client init (ProducerConfig/ConsumerConfig/AdminClientConfig) — pure startup noise that buries real logs.
# Silence just those loggers; genuine Kafka INFO (group rebalances, partition assignment) is kept.
logging:
  level:
    org.apache.kafka.clients.producer.ProducerConfig: warn
    org.apache.kafka.clients.consumer.ConsumerConfig: warn
    org.apache.kafka.clients.admin.AdminClientConfig: warn
